[package]
name = "spareswarm-server"
version = "0.1.0"
edition = "2024"
[dependencies]
axum = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11.1"

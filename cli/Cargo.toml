[package]
name = "spareswarm"
version = "0.1.0"
edition = "2024"
[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

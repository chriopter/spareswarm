name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: spareswarm-release
  cancel-in-progress: false
jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
  image:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chriopter/spareswarm:sha-${{ github.sha }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.76.0
          scan-type: image
          image-ref: ghcr.io/chriopter/spareswarm@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Promote scanned image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag ghcr.io/chriopter/spareswarm:production "ghcr.io/chriopter/spareswarm@$DIGEST"
      - name: Image summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image published as ghcr.io/chriopter/spareswarm@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://spareswarm.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Call YoloDeploy
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: python3 deploy/publish.py
      - name: Verify public version
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 10 https://spareswarm.com/health >/dev/null && curl -fsS --max-time 10 https://spareswarm.com/version | jq -e --arg commit "$COMMIT" '.commit == $commit' >/dev/null; then exit 0; fi
            sleep 3
          done
          echo 'Public endpoint does not serve the expected commit'; exit 1

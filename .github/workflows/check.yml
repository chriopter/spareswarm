name: Checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Check and build Rust crates
        run: |
          for crate in server cli; do
            cargo fmt --manifest-path "$crate/Cargo.toml" --check
            cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets --locked -- -D warnings
            cargo build --manifest-path "$crate/Cargo.toml" --locked
          done
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file server/Cargo.lock
          cargo audit --file cli/Cargo.lock
      - run: python3 tests/smoke.py
      - run: for file in web/*.js; do node --check "$file"; done
      - run: python3 -m unittest discover -s tests -p "test_deploy.py"
      - run: docker build -t spareswarm-check .
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: spareswarm-check
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
